# Kitnest 品牌官网 · 独立子域（v203 / 2026-11-05）
#
# 用途：把静态官网挂到 https://kitnest.sxyq27.online/
# 前提：DNS 需要一条 A 记录 kitnest.sxyq27.online → 124.222.153.108
#       （目前尚未添加；本文件先落地 HTTP 站点，DNS 生效后用 certbot 签发证书再开 443）
# 安装：/etc/nginx/conf.d/kitnest-subdomain.conf
#
# 站点根目录：/srv/kitnest-site
server {
    listen 80;
    listen [::]:80;
    server_name kitnest.sxyq27.online;

    access_log /var/log/nginx/kitnest-site.access.log;
    error_log /var/log/nginx/kitnest-site.error.log warn;

    # 证书签发前的 ACME 挑战目录
    location ^~ /.well-known/acme-challenge/ {
        alias /srv/kitnest-site/.well-known/acme-challenge/;
        default_type text/plain;
    }

    # 安装包：与官方更新通道同一份文件
    location ^~ /kitnest/releases/ {
        alias /srv/calorieai-updates/public/kitnest/releases/;
        default_type application/zip;
        limit_conn calorieai_update_downloads 2;
        limit_conn calorieai_update_download_clients 1;
        limit_conn_status 429;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 版本清单：直连线上 feed
    location ^~ /kitnest/ {
        alias /srv/calorieai-updates/public/kitnest/;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        root /srv/kitnest-site;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
}
