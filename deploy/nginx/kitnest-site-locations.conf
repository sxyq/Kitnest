# Kitnest 品牌官网 · nginx 片段（v203 / 2026-11-05）
#
# 插入 /etc/nginx/conf.d/calorieai-updates.conf 的 **443 server 块内**
# （脚本按 `location = /healthz {` 定位插入点，标记 <!-- kitnest-site:start --> 幂等识别）。
#
# 站点根目录：/srv/kitnest-site
# 清单与安装包：直接 alias 到线上更新目录，保证官网展示的版本始终是最新

    # kitnest-site:start —— Kitnest 品牌官网（静态站）
    location = /kitnest-site {
        return 301 /kitnest-site/;
    }

    # 安装包：与官方更新通道同一份文件（同源直出，下载即校验）
    location ^~ /kitnest-site/kitnest/releases/ {
        alias /srv/calorieai-updates/public/kitnest/releases/;
        default_type application/zip;
        limit_conn calorieai_update_downloads 2;
        limit_conn calorieai_update_download_clients 1;
        limit_conn_status 429;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 版本清单：直连线上 feed，官网永远显示当前发布版本
    location ^~ /kitnest-site/kitnest/ {
        alias /srv/calorieai-updates/public/kitnest/;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # 站点静态文件
    location ^~ /kitnest-site/ {
        root /srv;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
    # kitnest-site:end
